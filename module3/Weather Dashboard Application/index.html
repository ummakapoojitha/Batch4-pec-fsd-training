```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather Dashboard</h1>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>
        </div>

        <p id="errorMessage"></p>

        <div class="weather-card">

            <h2 id="cityName">Search for a city</h2>

            <img
                id="weatherIcon"
                src=""
                alt="Weather Icon"
            >

            <h3 id="temperature">-- °C</h3>

            <p id="description">
                Weather information will appear here
            </p>

            <div class="details">

                <div class="detail">
                    <span>💧</span>
                    <h4>Humidity</h4>
                    <p id="humidity">-- %</p>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <h4>Wind Speed</h4>
                    <p id="windSpeed">-- m/s</p>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
```
